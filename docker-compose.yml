version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: upi-mesh-postgres
    environment:
      POSTGRES_DB: upi_mesh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - upi-mesh-net

  redis:
    image: redis:7-alpine
    container_name: upi-mesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - upi-mesh-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upi-mesh-backend
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: upi-mesh-super-secret-key-2024-production-grade-256bit
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/upi_mesh_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - upi-mesh-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upi-mesh-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - upi-mesh-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  upi-mesh-net:
    driver: bridge
